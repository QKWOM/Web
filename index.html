<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会议期刊论文速查</title>
  <meta name="description" content="输入会议或期刊名称，按年份查看每篇论文的链接。数据来自 dblp 和 OpenReview。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232457c5'/%3E%3Cpath d='M9 8h10l4 4v12H9z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M12 15h8M12 19h8' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=20260925">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>会议期刊论文速查</h1>
      <p class="tagline">输入会议或期刊名称，按年份列出每篇论文的链接。数据来自 <a href="https://dblp.org" target="_blank" rel="noopener">dblp</a>，dblp 尚未收录的年份由 <a href="https://openreview.net" target="_blank" rel="noopener">OpenReview</a> 补充。</p>
      <form id="search-form" class="search" role="search">
        <label class="visually-hidden" for="q">会议或期刊名称</label>
        <input id="q" name="q" type="search" placeholder="会议或期刊名称，如 CVPR、NeurIPS、TPAMI" autocomplete="off" spellcheck="false" required>
        <button type="submit">搜索</button>
      </form>
      <div id="popular" class="chips" aria-label="常用会议和期刊"></div>
    </div>
  </header>

  <main class="wrap">
    <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    <div id="suggest" class="chip-row suggest" hidden></div>

    <section id="venues-section" class="card" hidden>
      <h2>匹配的会议和期刊</h2>
      <ul id="venues" class="venues"></ul>
    </section>

    <section id="years-section" class="card" hidden>
      <div class="section-head">
        <h2 id="venue-title"></h2>
        <a id="venue-link" class="subtle-link" target="_blank" rel="noopener">在 dblp 查看</a>
      </div>
      <div id="years" class="years"></div>
      <p id="years-note" class="years-note" hidden></p>
      <form id="year-form" class="year-form">
        <label for="year-input">其他年份</label>
        <input id="year-input" type="number" inputmode="numeric" min="1950" max="2100" placeholder="如 2019" required>
        <button type="submit">查看</button>
      </form>
    </section>

    <section id="papers-section" class="card" hidden>
      <div class="section-head">
        <h2 id="papers-title"></h2>
        <span id="papers-count" class="muted"></span>
      </div>
      <details id="proceedings" class="proceedings" hidden>
        <summary></summary>
        <ul></ul>
      </details>
      <div class="toolbar">
        <label class="visually-hidden" for="filter">筛选论文</label>
        <input id="filter" type="search" placeholder="按标题或作者筛选" autocomplete="off">
        <button id="copy-links" type="button" class="secondary">复制链接</button>
        <button id="export-csv" type="button" class="secondary">导出 CSV</button>
      </div>
      <ol id="papers" class="papers"></ol>
      <div class="load-more">
        <button id="load-more" type="button" class="secondary" hidden>加载更多</button>
      </div>
    </section>
  </main>

  <footer class="wrap footer">
    论文数据来自 <a href="https://dblp.org" target="_blank" rel="noopener">dblp computer science bibliography</a>（CC0）和 <a href="https://openreview.net" target="_blank" rel="noopener">OpenReview</a>。论文链接指向出版方、DOI 或开放获取页面。
  </footer>

  <script src="latex.js?v=20260925"></script>
  <script src="app.js?v=20260925"></script>
</body>
</html>
